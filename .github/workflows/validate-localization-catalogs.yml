name: Validate committed localization catalogs

on:
  push:
    branches:
      - dev
    paths:
      - "newIDE/app/src/locales/**"
      - ".github/workflows/validate-localization-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdng-localization-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-localization-catalogs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext

      # Translation compilation does not need the app's resource-import postinstall.
      - name: Install IDE dependencies
        working-directory: newIDE/app
        run: npm ci --ignore-scripts

      - name: Test Crowdin API helpers
        run: node --test .github/scripts/tests/*.test.mjs

      - name: Recompile committed translations
        working-directory: newIDE/app
        run: npm run compile-translations

      - name: Verify the English catalog
        run: test -s newIDE/app/src/locales/en/messages.js

      - name: Verify committed catalogs are reproducible
        run: git diff --exit-code -- newIDE/app/src/locales/
