name: Validate committed localization catalogs

on:
  push:
    branches:
      - dev
    paths:
      - "newIDE/app/src/locales/**"
      - ".github/workflows/validate-localization-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdng-localization-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-localization-catalogs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0

      # PO/POT source catalogs are intentionally gitignored. The Crowdin sync
      # already validates and compiles them before commit; this post-push job
      # validates the shipped JavaScript artifacts without needing those files.
      - name: Validate locale metadata and compiled catalog syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const root = path.resolve('newIDE/app/src/locales');
          const metadataPath = path.join(root, 'LocalesMetadata.js');
          if (!fs.existsSync(metadataPath) || fs.statSync(metadataPath).size === 0) {
            throw new Error('LocalesMetadata.js is missing or empty.');
          }

          const metadata = require(metadataPath);
          if (!Array.isArray(metadata) || metadata.length === 0) {
            throw new Error('LocalesMetadata.js must export a non-empty array.');
          }

          const seen = new Set();
          const checkJavaScript = file => {
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
              throw new Error('Missing or empty compiled catalog: ' + file);
            }
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              throw new Error('Invalid JavaScript catalog: ' + file + '\n' + (result.stderr || result.stdout));
            }
          };

          for (const entry of metadata) {
            if (!entry || typeof entry.languageCode !== 'string' || !/^[A-Za-z0-9_-]+$/.test(entry.languageCode)) {
              throw new Error('Invalid locale metadata entry: ' + JSON.stringify(entry));
            }
            if (seen.has(entry.languageCode)) {
              throw new Error('Duplicate locale metadata entry: ' + entry.languageCode);
            }
            seen.add(entry.languageCode);
            if (typeof entry.languageName !== 'string' || !entry.languageName) {
              throw new Error('Missing languageName for ' + entry.languageCode);
            }
            if (typeof entry.languageNativeName !== 'string' || !entry.languageNativeName) {
              throw new Error('Missing languageNativeName for ' + entry.languageCode);
            }
            if (!Number.isFinite(entry.translationRatio) || entry.translationRatio < 0 || entry.translationRatio > 1) {
              throw new Error('Invalid translationRatio for ' + entry.languageCode);
            }

            checkJavaScript(path.join(root, entry.languageCode, 'messages.js'));
          }

          if (!seen.has('en')) {
            throw new Error('The compiled English catalog is not present in locale metadata.');
          }

          const extensionMetadata = path.join(root, 'ExtensionLocalesMetadata.js');
          if (fs.existsSync(extensionMetadata)) checkJavaScript(extensionMetadata);

          let extensionCatalogCount = 0;
          for (const directory of fs.readdirSync(root, { withFileTypes: true })) {
            if (!directory.isDirectory()) continue;
            const extensionCatalog = path.join(root, directory.name, 'extension-messages.js');
            if (fs.existsSync(extensionCatalog)) {
              checkJavaScript(extensionCatalog);
              extensionCatalogCount += 1;
            }
          }

          console.log(
            'Validated ' + metadata.length + ' editor locale catalogs and ' +
            extensionCatalogCount + ' extension locale catalogs.'
          );
          NODE
