name: Validate committed localization catalogs

on:
  push:
    branches:
      - dev
    paths:
      - "newIDE/app/src/locales/**"
      - ".github/workflows/validate-localization-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdng-localization-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-localization-catalogs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0

      # PO/POT source catalogs are intentionally gitignored. The Crowdin sync
      # already validates and compiles them before commit; this post-push job
      # validates the shipped JavaScript artifacts without needing those files.
      - name: Validate locale metadata and compiled catalog syntax
        run: node scripts/validate-localization-catalogs.cjs
