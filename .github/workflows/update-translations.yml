# Download translations from Crowdin and open a Pull Request with compiled catalogs.
name: Update translations
on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-crowdin-translations
  cancel-in-progress: false
jobs:
  ensure-crowdin-seed:
    # The migration is only allowed from the production branch.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sync-upstream-translations.yml
    permissions:
      contents: write
    secrets:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  update-translations:
    needs: ensure-crowdin-seed
    # Manual dispatch from a non-main branch keeps the existing behavior; main must pass the seed first.
    if: ${{ always() && (needs.ensure-crowdin-seed.result == 'success' || needs.ensure-crowdin-seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: "948159"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: "npm"
          cache-dependency-path: "newIDE/app/package-lock.json"
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext
      - name: Install newIDE dependencies
        run: npm ci
        working-directory: newIDE/app
      - name: Test Crowdin API helpers
        run: node --test .github/scripts/tests/*.test.mjs
      # This audit uses GET requests only and reports upstream drift without changing GDevelop or GDNG.
      - name: Audit GDevelop and GDNG Crowdin parity (read-only)
        run: node .github/scripts/audit-crowdin-parity.mjs
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      # Extract source catalogs before exports, as required by the existing Lingui pipeline.
      - name: Extract translations
        run: npm run extract-all-translations
        working-directory: newIDE/app
      # File-based exports avoid the project-build permission required by crowdin download.
      - name: Download translations through Crowdin Export API
        run: node .github/scripts/download-crowdin-translations.mjs
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      # Lingui does not correctly compile the three-letter Nigerian Pidgin locale.
      - name: Remove catalogs not handled properly by Lingui
        run: rm -rf newIDE/app/src/locales/pcm_NG/
      - name: Compile translations
        run: npm run compile-translations
        working-directory: newIDE/app
      - name: Verify English catalog
        run: test -f newIDE/app/src/locales/en/messages.js
      - name: Create a Pull Request with the changes
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: Update translations
          branch: chore/update-translations
          delete-branch: true
          add-paths: |
            newIDE/app/src/locales/**
          title: "[Auto PR] Update translations"
          body: |
            This updates the translations by exporting the latest PO catalogs from the GDNG Crowdin project through the Crowdin API and compiling them for usage by the app.

            Please double check the values in newIDE/app/src/locales/LocalesMetadata.js to ensure the changes are sensible.

            Generated translation catalogs only are included. Dependency lockfiles and unrelated generated files are intentionally excluded.

            The workflow validates extraction, Crowdin exports, PO completeness, ICU syntax, Lingui compilation, and the English catalog before opening this PR.
