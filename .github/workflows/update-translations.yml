# Synchronize compiled localization catalogs from Crowdin and upstream extensions.
# Crowdin remains the source of truth; generated catalogs are committed directly to dev.
name: Sync localization
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdng-localization-sync
  cancel-in-progress: false

jobs:
  sync-localization:
    # Scheduled runs execute from the default branch. Always use the reviewed
    # workflow on main and synchronize the current dev integration branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CROWDIN_PROJECT_ID: "948159"
    steps:
      - name: Check out the current dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext

      - name: Install IDE dependencies
        working-directory: newIDE/app
        run: npm ci

      - name: Test Crowdin API helpers
        run: node --test .github/scripts/tests/*.test.mjs

      # This audit is read-only and confirms the export target is the GDNG project.
      - name: Audit GDevelop and GDNG Crowdin parity
        run: node .github/scripts/audit-crowdin-parity.mjs
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Re-extract sources before the export so the English catalog contains
      # every source string present in the dev revision.
      - name: Extract translations
        working-directory: newIDE/app
        run: npm run extract-all-translations

      - name: Download translations through the GDNG Crowdin Export API
        run: node .github/scripts/download-crowdin-translations.mjs
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Remove catalogs not handled properly by Lingui
        run: rm -rf newIDE/app/src/locales/pcm_NG/

      - name: Compile and validate translations
        working-directory: newIDE/app
        run: npm run compile-translations

      - name: Verify the English catalog
        run: test -s newIDE/app/src/locales/en/messages.js

      # Extension translations are already maintained in the upstream
      # GDevelop-extensions localization project. Mirror its compiled bundles;
      # do not edit or translate these files in the GDNG repository.
      - name: Synchronize upstream extension translation bundles
        shell: bash
        run: |
          set -euo pipefail
          extensions_repo="$RUNNER_TEMP/GDevelop-extensions"
          git clone --depth 1 https://github.com/GDevelopApp/GDevelop-extensions.git "$extensions_repo"
          translations_dir="$extensions_repo/.translations"
          test -s "$translations_dir/LocalesMetadata.js"

          # Remove only extension-generated artifacts before mirroring the upstream set.
          find newIDE/app/src/locales -mindepth 2 -maxdepth 2 -type f -name 'extension-messages.js' -delete
          rm -f newIDE/app/src/locales/ExtensionLocalesMetadata.js

          locale_count=0
          for folder in "$translations_dir"/*; do
            [[ -d "$folder" ]] || continue
            locale="${folder##*/}"
            test -s "$folder/messages.js"
            mkdir -p "newIDE/app/src/locales/$locale"
            cp "$folder/messages.js" "newIDE/app/src/locales/$locale/extension-messages.js"
            locale_count=$((locale_count + 1))
          done

          test "$locale_count" -gt 0
          cp "$translations_dir/LocalesMetadata.js" newIDE/app/src/locales/ExtensionLocalesMetadata.js
          echo "Synchronized extension catalogs for $locale_count locales."

      - name: Commit only generated locale files to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GDNG Localization Sync"
          git config user.email "gdng-localization-sync@users.noreply.github.com"

          git add -- newIDE/app/src/locales/
          if git diff --cached --quiet; then
            echo "Localization catalogs are already up to date; no commit is needed."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              newIDE/app/src/locales/*) ;;
              *)
                echo "Refusing to commit an out-of-scope path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(i18n): sync localization catalogs"

      # Create the narrowly-scoped installation token only after all exports,
      # validation and compilation have completed. It is short-lived and revoked
      # automatically at the end of this job.
      - name: Create repository-scoped localization GitHub App token
        uses: actions/create-github-app-token@v3
        id: localization-token
        with:
          client-id: ${{ vars.GDNG_LOCALIZATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.GDNG_LOCALIZATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: GDNG
          permission-contents: write

      - name: Rebase and push generated catalogs to dev
        shell: bash
        env:
          GH_TOKEN: ${{ steps.localization-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Rebase on the latest dev head instead of force-pushing over concurrent work.
          git fetch --no-tags origin dev
          git rebase origin/dev
          git push origin HEAD:refs/heads/dev
