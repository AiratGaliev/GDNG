name: Crowdin integration validation

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    paths:
      - "crowdin.yml"
      - ".github/scripts/**"
      - ".github/workflows/crowdin-integration-validation.yml"
      - ".github/workflows/sync-upstream-translations.yml"
      - ".github/workflows/extract-translations.yml"
      - ".github/workflows/update-translations.yml"
      - "newIDE/app/package.json"
      - "newIDE/app/package-lock.json"
      - "newIDE/app/scripts/extract-all-translations.js"
      - "newIDE/app/scripts/compile-translations.js"
      - "newIDE/app/scripts/lib/Locales.js"
      - "scripts/ExtractTranslations.sh"
      - "scripts/ExtractTranslations.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin-integration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-crowdin-pipeline:
    # Do not expose the Crowdin token to code from an external fork.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROWDIN_PROJECT_ID: "948159"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext

      - name: Install newIDE dependencies
        run: npm ci
        working-directory: newIDE/app

      - name: Test Crowdin API helpers
        run: node --test .github/scripts/tests/*.test.mjs

      # Keep the upstream GDevelop order: extract before upload/download.
      - name: Extract translations
        run: npm run extract-all-translations
        working-directory: newIDE/app

      - name: Verify extracted source catalogs
        run: |
          test -s newIDE/app/src/locales/en/ide-messages.pot
          test -s scripts/gdcore-gdcpp-gdjs-extensions-messages.pot

      # Validate the Crowdin CLI configuration without performing a remote write.
      - name: Install Crowdin CLI
        run: npm install --global @crowdin/cli@5.6.0

      - name: Validate crowdin.yml
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          crowdin --version
          crowdin config lint
          crowdin config sources
          crowdin config translations

      # This is a no-write preview; real source upload remains exclusive to main.
      - name: Verify GDNG upload target
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node .github/scripts/audit-crowdin-parity.mjs --assert-upload-target

      - name: Dry-run Crowdin source upload
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: crowdin upload sources --dryrun

      - name: Audit GDevelop and GDNG parity (read-only)
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node .github/scripts/audit-crowdin-parity.mjs

      # Same importer as main, but DRY_RUN=true so PR validation never changes project content.
      - name: Preview the one-time upstream seed
        env:
          SOURCE_PROJECT_ID: "79367"
          TARGET_PROJECT_ID: "948159"
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_IMPORT_CONCURRENCY: "4"
          DRY_RUN: "true"
        run: node .github/scripts/migrate-gdevelop-translations.mjs

      # Download from GDNG through per-file Export API, then run the real Lingui compile path.
      - name: Download GDNG translations
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node .github/scripts/download-crowdin-translations.mjs

      - name: Remove locale not supported by the Lingui compile pipeline
        run: rm -rf newIDE/app/src/locales/pcm_NG/

      - name: Compile translations
        run: npm run compile-translations
        working-directory: newIDE/app

      - name: Verify compiled catalogs and locale metadata
        run: |
          test -s newIDE/app/src/locales/en/messages.js
          test -s newIDE/app/src/locales/LocalesMetadata.js
