# Extract source strings from dev and upload them to the GDNG Crowdin project.
# Translated catalogs are never edited or uploaded from a developer's working tree.
name: Upload dev sources to Crowdin
on:
  push:
    branches:
      - dev
    paths:
      - "Core/**"
      - "GDJS/**"
      - "Extensions/**"
      - "newIDE/app/src/**"
      - "!newIDE/app/src/locales/**"
      - "newIDE/app/scripts/**"
      - "newIDE/app/package.json"
      - "newIDE/app/package-lock.json"
      - "scripts/ExtractTranslations.*"
      - "crowdin.yml"
      - ".github/scripts/**"
      - ".github/workflows/extract-translations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-upload:
    # Manual runs must explicitly select dev; topic branches never upload strings.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CROWDIN_PROJECT_ID: "948159"
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext

      - name: Install IDE dependencies
        working-directory: newIDE/app
        run: npm ci

      - name: Extract source catalogs
        working-directory: newIDE/app
        run: npm run extract-all-translations

      - name: Verify Crowdin upload target
        env:
          CROWDIN_PERSONAL_TOKEN: \${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node .github/scripts/audit-crowdin-parity.mjs --assert-upload-target

      - name: Install Crowdin CLI
        run: npm install --global @crowdin/cli@5.6.0

      - name: Upload source catalogs to GDNG Crowdin
        run: crowdin upload sources
        env:
          CROWDIN_PERSONAL_TOKEN: \${{ secrets.CROWDIN_PERSONAL_TOKEN }}
