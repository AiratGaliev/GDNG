# GitHub Action to extract translations and (later) upload them to Crowdin.

name: Extract translations
on:
  # Execute for all commits (to ensure translations extraction works)
  push:
    branches:
      - "**"
    tags-ignore:
      - "**" # Don't run on new tags
  # Allows to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "newIDE/app/package-lock.json"

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext

      - name: Install newIDE dependencies
        run: npm ci
        working-directory: newIDE/app

      - name: Extract translations
        run: npm run extract-all-translations
        working-directory: newIDE/app

      # Never upload source catalogs until the destination is proven to be GDNG (948159).
      - name: Verify Crowdin upload target
        if: github.ref == 'refs/heads/main'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node .github/scripts/audit-crowdin-parity.mjs --assert-upload-target

      # Only upload on Crowdin for the main branch
      - name: Install Crowdin CLI
        if: github.ref == 'refs/heads/main'
        run: npm i -g @crowdin/cli

      - name: Upload translations to Crowdin
        run: crowdin upload sources
        if: github.ref == 'refs/heads/main'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
